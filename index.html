<title>Power Level</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column; large titles; grouped cards on pure black; a floating tab bar
   with a raised centre Start button. Direction follows openGym's iOS-like system: neutral
   surface ramp, hairlines not borders, weight carries meaning, colour spent on accent + status. */
:root {
  --bg: #000000; --bg-el: #0e0e10; --surface: #1c1c1e; --surface-2: #2c2c2e; --surface-3: #3a3a3c;
  --label: #ffffff; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .34); --label-4: rgba(235, 235, 245, .16);
  --sep: rgba(84, 84, 88, .6);
  --green: #30d158; --red: #ff453a; --orange: #ff9f0a; --yellow: #ffd60a; --blue: #0a84ff; --teal: #40c8e0; --purple: #bf5af2; --pink: #ff375f;
  --acc: var(--green); --on-acc: #000000;
  --acc-soft: color-mix(in srgb, var(--acc) 16%, transparent);
  --m-p: #ff7a59; --m-c: #64d2ff; --m-f: #bf5af2;
  --body-base: #3a3a3c; --body-inert: #2c2c2e;
  --fighter-skin: #f5c9a4; --fighter-gi: #f08a24; --fighter-pants: #2b3d78; --fighter-belt: #1a1a1a; --fighter-band: #d7263d;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
  --ease: cubic-bezier(.32, .72, 0, 1); --fast: 140ms; --med: 220ms;
  --tab-h: 62px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f2f7; --bg-el: #f7f7fa; --surface: #ffffff; --surface-2: #ececef; --surface-3: #e3e3e8;
  --label: #000000; --label-2: rgba(60, 60, 67, .62); --label-3: rgba(60, 60, 67, .34); --label-4: rgba(60, 60, 67, .14);
  --sep: rgba(60, 60, 67, .22);
  --green: #248a3d; --red: #d70015; --orange: #c93400; --yellow: #a05a00; --blue: #0040dd; --teal: #008299; --purple: #8944ab; --pink: #d30f45;
  --on-acc: #ffffff; --body-base: #d1d1d6; --body-inert: #e5e5ea; color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f2f2f7; --bg-el: #f7f7fa; --surface: #ffffff; --surface-2: #ececef; --surface-3: #e3e3e8;
  --label: #000000; --label-2: rgba(60, 60, 67, .62); --label-3: rgba(60, 60, 67, .34); --label-4: rgba(60, 60, 67, .14);
  --sep: rgba(60, 60, 67, .22);
  --green: #248a3d; --red: #d70015; --orange: #c93400; --yellow: #a05a00; --blue: #0040dd; --teal: #008299; --purple: #8944ab; --pink: #d30f45;
  --on-acc: #ffffff; --body-base: #d1d1d6; --body-inert: #e5e5ea; color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--label); overflow-x: clip; }
body { font-family: var(--font); font-size: 17px; line-height: 1.35; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
p { margin: 0; }
.tnum, .step-input, .kv b, .power-num, .rest-time, .ring b, .tile-value, .big-num, .weight-big b { font-variant-numeric: tabular-nums; }
.muted { color: var(--label-2); } .small { font-size: .82rem; } .center { text-align: center; } .right { margin-left: auto; }
.warn { color: var(--red); } .pad { padding: 14px 16px; } .inline { display: inline; font-size: .8rem; color: var(--label-3); margin-left: 4px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.app { max-width: 640px; margin: 0 auto; min-height: 100%; padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 96px); }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px 16px; }

/* Titles */
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: 14px; }
.large-title { font-size: 2.15rem; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.1; text-wrap: balance; }
.page-sub { color: var(--label-2); font-size: 1.05rem; margin-top: 2px; }
.page-actions { display: flex; gap: 8px; }
.title-2 { font-size: 1.35rem; font-weight: 600; } .title-3 { font-size: 1.1rem; font-weight: 600; }
.eyebrow { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }
.section-label { font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: var(--label-2); padding: 6px 4px 0; }
.big-num { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }

/* Surfaces */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; width: 100%; }
button.card { transition: transform var(--fast) var(--ease); } button.card:active { transform: scale(.985); }
.card-flat { background: var(--surface); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.sheet .card-flat, .sheet .group { background: var(--surface-2); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-title { font-size: 1rem; color: var(--label-2); }
.head-actions { display: flex; align-items: center; gap: 14px; }
.divider { height: .5px; background: var(--sep); margin: 4px 0; }
.callout { background: var(--acc-soft); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.callout.good { background: color-mix(in srgb, var(--green) 16%, transparent); }
/* older views */
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.h1 { font-size: 1.9rem; font-weight: 700; margin: 0; letter-spacing: -.01em; } .h2 { font-size: 1.08rem; font-weight: 600; margin: 0; } .h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--label-2); margin: 6px 0 0; }

/* Grouped list rows */
.group { background: var(--surface); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.group.inset { background: transparent; margin: 0 -4px; }
.row-btn, .toggle-row { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 10px 16px; text-align: left; width: 100%; position: relative; }
.row-btn + .row-btn::before, .toggle-row + .toggle-row::before, .row-btn + .toggle-row::before, .toggle-row + .row-btn::before, .item-row + .item-row::before, .item-row + .row-btn::before {
  content: ''; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.row-btn:active { background: var(--surface-2); }
.row-btn.on { color: var(--acc); }
.row-btn.danger { color: var(--red); }
.row-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-3); color: var(--label); flex: none; }
.row-btn.danger .row-ic { color: var(--red); }
.row-main { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.row-main > span { overflow-wrap: anywhere; }
.row-main small { color: var(--label-2); font-size: .82rem; }
.toggle-row.today { background: var(--acc-soft); }
.toggle-row .select { max-width: 52%; }

/* Controls */
.circle-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--label); flex: none; transition: transform var(--fast) var(--ease); }
.circle-btn:active { transform: scale(.94); }
.circle-btn.plain { background: transparent; }
.circle-btn.go { color: var(--acc); }
.sheet .circle-btn { background: var(--surface-2); }
.btn { border-radius: var(--r); padding: 12px 18px; background: var(--surface-2); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform var(--fast) var(--ease), background var(--fast); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--acc); color: var(--on-acc); }
.btn.ghost { background: transparent; color: var(--label-2); padding-inline: 8px; align-self: flex-start; font-weight: 500; }
.btn.danger { background: var(--red); color: #fff; }
.btn.danger-text { color: var(--red); }
.btn.small { padding: 8px 12px; font-size: .88rem; border-radius: var(--r-sm); }
.btn.wide { width: 100%; } .btn.big { padding: 15px; font-size: 1.05rem; width: 100%; }
.btn.on { background: var(--acc-soft); color: var(--acc); }
.text-btn { color: var(--acc); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; font-size: .95rem; padding: 4px 0; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(60, 60, 67, .72); color: #fff; border-radius: 99px; padding: 7px 13px; font-size: .88rem; backdrop-filter: blur(8px); }
.pill-go { background: color-mix(in srgb, var(--acc) 22%, transparent); color: var(--acc); border-radius: var(--r-sm); padding: 6px 14px; font-weight: 600; }
.link { color: var(--acc); font-weight: 500; font-size: .82rem; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; background: var(--surface-3); border-radius: 10px; padding: 2px; gap: 2px; }
.card .seg, .sheet .seg { background: var(--surface-2); }
.seg-btn { flex: 1; border-radius: 8px; padding: 8px 6px; font-size: .92rem; font-weight: 500; color: var(--label-2); transition: background var(--fast); min-width: 0; }
.seg-btn.on { background: var(--bg-el); color: var(--label); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.card .seg-btn.on, .sheet .seg-btn.on { background: var(--surface-3); }
.seg-sm .seg-btn { padding: 6px 4px; font-size: .84rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 99px; padding: 8px 14px; font-size: .9rem; background: var(--surface-2); color: var(--label); }
.card .chip, .sheet .chip { background: var(--surface-3); }
.chip.on { background: var(--acc); color: var(--on-acc); }
.chips-sm .chip { padding: 6px 11px; font-size: .84rem; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.input { width: 100%; background: var(--surface-2); border: 0; border-radius: var(--r-sm); padding: 11px 12px; min-width: 0; }
.card .input, .sheet .input { background: var(--surface-3); }
.input:focus { outline: 2px solid var(--acc); }
.select { width: auto; }
.date-input { width: auto; }
.title-input { font-size: 1.3rem; font-weight: 600; background: transparent !important; padding-inline: 0; border-bottom: .5px solid var(--sep); border-radius: 0; }
textarea.input { resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: .8rem; color: var(--label-2); }
.field-hint { font-size: .78rem; color: var(--label-3); }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .row-4 { grid-template-columns: 1fr 1fr; } }
.switch { appearance: none; width: 51px; height: 31px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; cursor: pointer; transition: background var(--med); }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .25); transition: transform var(--med) var(--ease); }
.switch:checked { background: var(--green); } .switch:checked::after { transform: translateX(20px); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 0 12px; color: var(--label-3); }
.search input { flex: 1; background: transparent; border: 0; padding: 11px 0; color: var(--label); min-width: 0; }
.search input:focus { outline: none; }
.inline-form { display: flex; gap: 10px; align-items: center; }
.inline-form .input { width: 120px; font-size: 1.4rem; font-weight: 700; text-align: center; }
.meter { height: 6px; border-radius: 99px; background: var(--surface-3); overflow: hidden; flex: 1; }
.meter span { display: block; height: 100%; border-radius: inherit; background: var(--acc); transition: width .5s var(--ease); }
.m-p span { background: var(--m-p); } .m-c span { background: var(--m-c); } .m-f span { background: var(--m-f); }
.ic { flex: none; }

/* Tab bar with raised centre button */
.tabbar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: color-mix(in srgb, var(--bg-el) 92%, transparent); backdrop-filter: blur(20px);
  border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
.tab { flex: 1; max-width: 128px; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--label-3); font-size: .72rem; font-weight: 500; }
.tab.on { color: var(--acc); }
.tab.centre { color: var(--acc); font-weight: 600; }
.tab.centre .tab-ic { width: 60px; height: 60px; margin-top: -30px; border-radius: 50%; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; box-shadow: 0 0 0 6px var(--bg), 0 6px 24px color-mix(in srgb, var(--acc) 45%, transparent); transition: transform var(--fast) var(--ease); }
.tab.centre:active .tab-ic { transform: scale(.94); }
.in-session .tab.centre .tab-ic { background: var(--orange); box-shadow: 0 0 0 6px var(--bg), 0 6px 24px color-mix(in srgb, var(--orange) 45%, transparent); }
.in-session .tab.centre { color: var(--orange); }

/* Sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn var(--med) ease; }
.sheet { width: min(640px, 100%); max-height: 86%; background: var(--bg-el); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; animation: up .28s var(--ease); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.tall { max-height: 94%; height: 94%; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-4); margin: 7px auto 0; flex: none; }
@keyframes up { from { transform: translateY(60px); opacity: .6; } } @keyframes fadeIn { from { opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 16px 6px; }
.sheet-head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.sheet-body > * { flex-shrink: 0; }
.sheet-body { overflow-y: auto; padding: 6px 16px 26px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 90px); background: var(--surface-3); color: var(--label);
  border-radius: 14px; padding: 12px 16px; font-size: .92rem; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); animation: fadeIn .2s; }
.toast-btn { color: var(--acc); font-weight: 600; white-space: nowrap; }

/* Wheel picker */
.wheel { position: relative; height: 200px; margin: 4px auto; width: min(240px, 100%); }
.wheel-band { position: absolute; left: 0; right: 0; top: 80px; height: 40px; border-radius: 10px; background: var(--surface-2); pointer-events: none; }
.wheel-list { position: relative; height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel-list::-webkit-scrollbar { display: none; }
.wheel-pad { height: 80px; }
.wheel-item { height: 40px; display: grid; place-items: center; scroll-snap-align: start; font-size: 1.3rem; color: var(--label-3); font-variant-numeric: tabular-nums; cursor: pointer; }
.wheel-item.on { color: var(--label); font-weight: 600; }

/* Home */
.week-head { display: flex; justify-content: space-between; align-items: center; }
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; color: var(--label); }
.wday small { color: var(--label-2); font-size: .72rem; letter-spacing: .04em; }
.wday b { font-size: 1.3rem; font-weight: 500; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
.wday.sel b { background: var(--surface-3); }
.wday.today b { background: var(--acc); color: var(--on-acc); font-weight: 700; }
.wdot { width: 6px; height: 6px; border-radius: 50%; }
.wdot.trained { background: var(--green); } .wdot.planned { background: var(--orange); }
.today-row { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; }
.today-row .row-main span { font-size: 1.15rem; font-weight: 500; }
.today-row .row-main small { font-size: .72rem; letter-spacing: .06em; }
.today-ic { width: 42px; height: 42px; border-radius: 10px; background: var(--acc); color: var(--on-acc); display: grid; place-items: center; flex: none; }
.today-ic.live { background: var(--orange); } .today-ic.done { background: color-mix(in srgb, var(--green) 25%, transparent); color: var(--green); }
.today-ic.soft { background: var(--surface-3); color: var(--label-2); }
.weight-big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.weight-big b { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; }
.weight-big .unit { font-size: 1.3rem; color: var(--label-2); font-weight: 600; }
.delta { font-size: .95rem; font-weight: 500; } .delta.down { color: var(--green); } .delta.up { color: var(--orange); }
.goal-chip, .goal-line-text { color: var(--yellow); display: inline-flex; align-items: center; gap: 5px; }
.streak-big { font-size: 1.45rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.flame { color: var(--orange); }
.goal-mini { display: flex; flex-direction: column; gap: 6px; }
.goal-mini div:first-child { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 10px; }
.macro-bars { display: grid; gap: 9px; }
.mb { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; font-size: .86rem; }
.streak, .week-card { cursor: default; }

/* Power card */
.power-card { position: relative; overflow: hidden; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; cursor: pointer;
  background: radial-gradient(120% 140% at 0% 100%, color-mix(in srgb, var(--orange) 18%, transparent), transparent 60%), var(--surface); border-radius: var(--r-lg); padding: 10px 16px 12px 4px; }
.power-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.power-info .eyebrow { color: var(--orange); }
.power-num { font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.tier-name { font-weight: 600; color: var(--orange); }
.power-card .meter span { background: var(--orange); }
.fighter { display: block; overflow: visible; max-width: 100%; height: auto; }
.fighter .aura { transform-origin: 84px 130px; animation: aura 1.6s ease-in-out infinite; }
.fighter .flame { transform-origin: center bottom; animation: flameA .9s ease-in-out infinite alternate; }
.fighter .f2 { animation-delay: .3s; } .fighter .f3 { animation-delay: .15s; }
.fighter .sparks { animation: spark .5s steps(2) infinite; }
.fighter.charging .body, .fighter.charging .head { animation: shake .08s linear infinite; }
@keyframes aura { 50% { transform: scale(1.05); opacity: .85; } } @keyframes flameA { to { transform: scaleY(1.12) translateY(-4px); } }
@keyframes spark { 50% { opacity: 0; } } @keyframes shake { 25% { transform: translate(1px, -1px); } 75% { transform: translate(-1px, 1px); } }
.tier-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.tier-list li { display: flex; align-items: center; gap: 12px; opacity: .4; } .tier-list li.got { opacity: 1; }
.tier-list li div { display: flex; flex-direction: column; } .tier-list span { color: var(--label-2); font-size: .85rem; }
.powerup { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0, 0, 0, .8); backdrop-filter: blur(4px); animation: fadeIn .3s; }
.powerup-inner { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: zoom .5s cubic-bezier(.2, 1.6, .4, 1); }
.powerup-name { font-size: 2.2rem; font-weight: 800; color: var(--orange); } @keyframes zoom { from { transform: scale(.6); } }

/* Session */
.session { display: flex; flex-direction: column; gap: 14px; }
.session-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; padding-block: 10px; background: var(--bg); margin: 0 -2px; }
.session-title { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
.session-title b { font-size: 1.15rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.session-title span { color: var(--label-2); font-size: .92rem; }
.progress { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: -8px; }

/* Narrow phones (folded Galaxy Z Fold cover screens are ~344px): slimmer controls so the

  .step-btn { width: 22px; font-size: 1.2rem; }
  .step-input { font-size: 1.02rem; }

}

}

/* Library */

/* Body map */

.part.inert path { fill: var(--body-inert); }

/* Plan */

/* Stats */

.tag-flag { color: var(--pink); font-size: .74rem; }

/* Charts */

.s-raw .line { stroke: var(--label-3); stroke-width: 1; } .s-raw .dot { fill: var(--label); } .s-raw .dot.flag { fill: var(--pink); stroke: var(--surface); stroke-width: 1.5; }
.s-raw .area { fill: color-mix(in srgb, var(--label) 8%, transparent); }

  background: radial-gradient(closest-side, var(--surface) 78%, transparent 80%), conic-gradient(var(--green) calc(var(--pct) * 1%), var(--surface-2) 0); }

.pick-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }

.src-tag { flex: none; font-style: normal; font-size: .7rem; font-weight: 600; letter-spacing: .02em; border-radius: 6px; padding: 2px 6px; background: var(--surface-3); color: var(--label-2); white-space: nowrap; }
.src-afcd { color: var(--teal); background: color-mix(in srgb, var(--teal) 16%, transparent); }

.inline-form { display: flex; gap: 8px; } .inline-form .input { flex: 1; min-width: 0; }
.scanner { position: relative; border-radius: var(--r); overflow: hidden; background: #000; }
